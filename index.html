      inapp: '请先用浏览器打开', inappIOS: '点右上角「···」，选「在 Safari 中打开」。', inappAnd: '点右上角「⋮」或「···」，选「在浏览器中打开」。',
      copy: '复制网址', copied: '已复制 ✓',
      iosT: '🍎 iPhone（要用 Safari）', andT: '🤖 安卓手机',
      ios: ['先点上面的「<b>打开</b>」，进入这个 App。', '点「<b>分享</b>」：屏幕下方的「方框加向上箭头」；如果只看到「⋯」，先点它再选「分享」。', '往下滑，点「<b>添加到主屏幕</b>」，再点「<b>添加</b>」。', '回到手机桌面，点图标就能用。'],
      and: ['先点上面的「<b>打开</b>」，进入这个 App。', '点右上角菜单「<b>⋮</b>」。', '选「<b>添加到主屏幕</b>」或「<b>安装应用</b>」，再点确认。', '回到手机桌面，点图标就能用。'],
      note: '添加到主屏幕后，请从桌面图标打开，记录才会存在 App 里。' },
    'en': { tag: 'Small tools made by one person · Free · No sign-up', secT: 'ALL APPS', open: 'Open', inst: 'Add to Home Screen',
      foot: 'Your data stays on your own phone and is never uploaded.', setT: 'Settings', langL: 'Language', close: 'Close',
      inapp: 'Please open in your browser', inappIOS: 'Tap “···” at the top right, then “Open in Safari”.', inappAnd: 'Tap “⋮” or “···” at the top right, then “Open in browser”.',
      copy: 'Copy link', copied: 'Copied ✓',
      iosT: '🍎 iPhone (use Safari)', andT: '🤖 Android',
      ios: ['Tap <b>Open</b> above to enter the app.', 'Tap <b>Share</b> (the square with an up arrow at the bottom). If you only see “⋯”, tap it first, then choose Share.', 'Scroll down and tap <b>Add to Home Screen</b>, then <b>Add</b>.', 'Go back to your home screen and tap the icon.'],
      and: ['Tap <b>Open</b> above to enter the app.', 'Tap the <b>⋮</b> menu at the top right.', 'Choose <b>Add to Home screen</b> or <b>Install app</b>, then confirm.', 'Go back to your home screen and tap the icon.'],
      note: 'After adding, always open it from the home-screen icon so your records are kept in the app.' }
  };
  const LANGS = [['zh-Hant', '繁體中文'], ['zh-Hans', '简体中文'], ['en', 'English']];
  const $ = id => document.getElementById(id);
  const ua = (navigator && navigator.userAgent) || '';
  const isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/i.test(ua);
  const inApp = /MicroMessenger|XiaoHongShu|xhsdiscover|Line\/|FBAN|FBAV|Instagram|\bQQ\/|Weibo|DingTalk/i.test(ua);

  const detect = () => {
    const l = ((navigator.languages && navigator.languages[0]) || navigator.language || 'en').toLowerCase();
    if (l.indexOf('zh') === 0) return /hant|tw|hk|mo/.test(l) ? 'zh-Hant' : 'zh-Hans';
    return 'en';
  };
  let lang = null;
  try { lang = localStorage.getItem(LKEY); } catch (e) {}
  if (!I18N[lang]) lang = detect();
  let T = I18N[lang];
  const openG = {};

  const steps = list => `<ol class="steps">${list.map((s, i) => `<li><span class="num">${i + 1}</span><span>${s}</span></li>`).join('')}</ol>`;
  const guide = () => {
    let h = '';
    if (isIOS || !isAndroid) h += `<div class="gh">${T.iosT}</div>${steps(T.ios)}`;
    if (isAndroid || !isIOS) h += `<div class="gh">${T.andT}</div>${steps(T.and)}`;
    return h + `<div class="note">${T.note}</div>`;
  };

  function render() {
    T = I18N[lang];
    document.documentElement.lang = lang;
    $('tag').textContent = T.tag;
    $('secT').textContent = T.secT;
    $('foot').textContent = T.foot;
    $('gearBtn').setAttribute('aria-label', T.setT);
    $('setTitle').textContent = T.setT;
    $('langLbl').textContent = T.langL;
    $('setClose').setAttribute('aria-label', T.close);
    $('langList').innerHTML = LANGS.map(([c, n]) =>
      `<button class="lang ${c === lang ? 'on' : ''}" data-l="${c}"><span>${n}</span><span>${c === lang ? '✓' : ''}</span></button>`).join('');
    $('banner').innerHTML = inApp
      ? `<div class="warn"><b>${T.inapp}</b><div>${isIOS ? T.inappIOS : T.inappAnd}</div><button id="copyBtn" class="copy">${T.copy}</button></div>` : '';
    $('list').innerHTML = APPS.map(a => `<div class="sys card">
      <div class="row"><img class="aicon" src="${a.icon}" alt=""><div><div class="aname">${a.names[lang]}</div><div class="adesc">${a.desc[lang]}</div></div></div>
      <div class="btns"><a class="btn pri" href="${a.href}">${T.open}</a><button class="btn alt" data-g="${a.id}">${T.inst} ${openG[a.id] ? '▴' : '▾'}</button></div>
      <div class="guide ${openG[a.id] ? '' : 'hidden'}">${guide()}</div></div>`).join('');
  }

  $('list').addEventListener('click', e => {
    const b = e.target.closest('[data-g]');
    if (!b) return;
    openG[b.dataset.g] = !openG[b.dataset.g];
    render();
  });
  $('banner').addEventListener('click', e => {
    if (!e.target.closest('#copyBtn')) return;
    const done = () => { const c = $('copyBtn'); if (c) { c.textContent = T.copied; } };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(location.href).then(done, () => {}); return; }
    } catch (err) {}
    const t = document.createElement('textarea'); t.value = location.href; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); done(); } catch (err) {}
    document.body.removeChild(t);
  });
  const openSet = () => $('settings').classList.add('show');
  const closeSet = () => $('settings').classList.remove('show');
  $('gearBtn').addEventListener('click', openSet);
  $('setClose').addEventListener('click', closeSet);
  $('settings').addEventListener('click', e => { if (e.target === $('settings')) closeSet(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSet(); });
  $('langList').addEventListener('click', e => {
    const b = e.target.closest('[data-l]');
    if (!b) return;
    lang = b.dataset.l;
    try { localStorage.setItem(LKEY, lang); } catch (err) {}
    render();
  });
  render();
})();
</script>
</body>
</html>
