<title>埼玉訓練</title>
<style>
  /* minimal utilities (no external CSS/JS needed) */
  *, ::before, ::after { box-sizing: border-box; border: 0 solid; }
  html { line-height: 1.5; -webkit-text-size-adjust: 100%; }
  body { margin: 0; }
  button { background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; text-align: center; }
  .flex{display:flex}.flex-col{flex-direction:column}.flex-1{flex:1 1 0%}.grid{display:grid}.hidden{display:none}
  .grid-cols-7{grid-template-columns:repeat(7,minmax(0,1fr))}
  .items-center{align-items:center}.items-start{align-items:flex-start}.items-end{align-items:flex-end}.items-baseline{align-items:baseline}
  .justify-between{justify-content:space-between}
  .gap-2{gap:.5rem}.gap-3{gap:.75rem}.gap-y-1{row-gap:.25rem}
  .px-4{padding-left:1rem;padding-right:1rem}.pb-3{padding-bottom:.75rem}.py-2{padding-top:.5rem;padding-bottom:.5rem}
  .py-3{padding-top:.75rem;padding-bottom:.75rem}.py-4{padding-top:1rem;padding-bottom:1rem}.p-4{padding:1rem}
  .mx-4{margin-left:1rem;margin-right:1rem}.mb-1{margin-bottom:.25rem}.mb-3{margin-bottom:.75rem}
  .mt-1{margin-top:.25rem}.mt-2{margin-top:.5rem}.mt-3{margin-top:.75rem}.mt-4{margin-top:1rem}
  .space-y-1>*+*{margin-top:.25rem}
  .h-full{height:100%}.w-full{width:100%}.h-2{height:.5rem}.h-12{height:3rem}.min-h-0{min-height:0}
  .text-11{font-size:11px}.text-xs{font-size:.75rem;line-height:1rem}.text-sm{font-size:.875rem;line-height:1.25rem}
  .text-lg{font-size:1.125rem;line-height:1.75rem}.text-xl{font-size:1.25rem;line-height:1.75rem}
  .text-2xl{font-size:1.5rem;line-height:2rem}.text-4xl{font-size:2.25rem;line-height:2.5rem}
  .font-bold{font-weight:700}.font-black{font-weight:900}
  .tracking-wide{letter-spacing:.025em}.tracking-wider{letter-spacing:.05em}.tracking-widest{letter-spacing:.1em}
  .text-left{text-align:left}.text-right{text-align:right}.text-center{text-align:center}.text-white{color:#fff}
  .opacity-60{opacity:.6}.opacity-70{opacity:.7}.opacity-80{opacity:.8}
  .bg-w10{background:rgba(255,255,255,.1)}
  .rounded-full{border-radius:9999px}.rounded-xl{border-radius:.75rem}.rounded-2xl{border-radius:1rem}
  .overflow-hidden{overflow:hidden}.overflow-y-auto{overflow-y:auto}
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse 90% 38% at 50% -6%, rgba(232,96,28,.26), transparent 70%), #0b0b0d fixed;
    color: #f2f2f3;
    font-family: system-ui, -apple-system, "SF Pro Display", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  .sys {
    border: 1px solid rgba(255,255,255,.07);
    border-top-color: rgba(255,122,48,.55);
    background: linear-gradient(160deg, rgba(255,122,48,.15), rgba(21,21,23,.96) 48%);
    box-shadow: 0 0 22px rgba(232,96,28,.12);
    border-radius: 20px;
  }
  .glow { color: #ff8a45; text-shadow: 0 0 12px rgba(255,122,48,.5); }
  .cell {
    min-width: 0;
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.05);
    color: #b9b9bf;
    transition: transform .12s, box-shadow .2s, background .2s;
  }
  .cell:active:not(:disabled) { transform: scale(.94); }
  .cell.on { background: linear-gradient(135deg, #ff7a30, #d9531a); color: #fff; border-color: #ffb27f; box-shadow: 0 0 16px rgba(255,122,48,.6); }
  .cell:disabled { cursor: not-allowed; }
  .locked .cell:not(.on) { opacity: .35; }
  .bar { background: linear-gradient(90deg, #d9531a, #ff8a45); box-shadow: 0 0 10px rgba(255,122,48,.7); transition: width .3s; }
  .quest { border: 1px solid #ffb27f; background: linear-gradient(135deg, rgba(255,122,48,.42), rgba(217,83,26,.25)); box-shadow: 0 0 26px rgba(255,122,48,.45); animation: pop .5s ease-out; }
  @keyframes pop { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .task {
    --g: 100% 0%;
    position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: 14px;
    flex: 1 0 136px; overflow: hidden; border-radius: 22px; padding: 18px;
    border: 1px solid rgba(255,255,255,.07); border-top-color: rgba(255,122,48,.5);
    background: radial-gradient(circle at var(--g), rgba(255,122,48,.32), transparent 58%), linear-gradient(150deg, #1b1b1e, #0f0f11);
  }
  .t1 { --g: 100% 0%; } .t2 { --g: 0% 0%; } .t3 { --g: 100% 100%; }
  .t4 { --g: 0% 100%; } .t5 { --g: 100% 20%; } .t6 { --g: 0% 20%; }
  .task.is-done { background: linear-gradient(135deg, #f26b24, #c44a12); border-color: #ffb27f; box-shadow: 0 0 24px rgba(255,122,48,.5); }
  .is-done .glow { color: #fff; text-shadow: none; }
  .is-done .cell.on { background: rgba(255,255,255,.25); border-color: rgba(255,255,255,.65); box-shadow: none; }
  .act { color: #fff; font-size: 1rem; font-weight: 800; padding: 10px 20px; border-radius: 999px;
    background: linear-gradient(135deg, #ff7a30, #e8601c); box-shadow: 0 0 16px rgba(255,122,48,.45); transition: transform .12s; white-space: nowrap; }
  .is-done .act { background: rgba(255,255,255,.22); box-shadow: none; }
  .act:active:not(:disabled) { transform: scale(.94); }
  .act:disabled { cursor: not-allowed; opacity: .8; }
  @media (prefers-reduced-motion: reduce) { .quest { animation: none; } .cell, .bar, .act { transition: none; } }
  .nav { display: flex; align-items: center; gap: 6px; padding: 8px 4px; font-size: 18px; color: #cfcfd4; }
  .nav:disabled { opacity: .25; cursor: not-allowed; }
  .day { position: relative; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; margin: 0 auto;
    border-radius: 50%; font-size: 14px; color: #e8e8ea; }
  .day.done { background: #e8601c; color: #fff; font-weight: 700; box-shadow: 0 0 14px rgba(255,122,48,.55); }
  .day.today { border: 2px solid #ff7a30; color: #ff8a45; font-weight: 700; }
  .day.done.today { border-color: #ffb27f; color: #fff; }
  .day.pre { color: rgba(255,255,255,.4); }
  .day.off { color: rgba(255,255,255,.2); cursor: not-allowed; }
  .day.sel { box-shadow: 0 0 0 2px rgba(255,255,255,.55); }
  .day.miss::after { content: ''; position: absolute; bottom: 3px; width: 4px; height: 4px; border-radius: 50%; background: #e5586b; }
  button:focus-visible { outline: 2px solid #ffb27f; outline-offset: 2px; }
  .text-3xl{font-size:1.875rem;line-height:2.25rem}
  .gear { display:flex; align-items:center; justify-content:center; width:44px; height:44px; border-radius:50%; color:#cfcfd4;
    border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); flex:none; }
  .gear svg { width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .sheet { display:none; position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.65); align-items:flex-end; }
  .sheet.show { display:flex; }
  .lang { display:flex; align-items:center; justify-content:space-between; width:100%; padding:14px 16px; border-radius:14px;
    border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); font-size:1.05rem; color:#f2f2f3; text-align:left; }
  .lang.on { border-color:#ff7a30; background:rgba(255,122,48,.15); color:#ffb27f; font-weight:700; }
</style>
</head>

      <div id="dayTxt" class="glow text-3xl font-black tracking-wider"></div>
    </div>
    <button id="gearBtn" class="gear"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </div>
</header>

<section id="panel" class="sys hidden mx-4 mb-3 overflow-y-auto p-4" style="max-height:68dvh">
  <div class="mb-3 flex items-center justify-between">
    <button id="prevM" class="nav"><span>←</span><span id="prevL" class="text-xs"></span></button>
    <div id="monthTxt" class="text-lg font-bold text-white"></div>
    <button id="nextM" class="nav"><span id="nextL" class="text-xs"></span><span>→</span></button>
  </div>
  <div id="wkHead" class="mb-1 grid grid-cols-7 text-center text-xs" style="color:#9a9aa0"></div>
  <div id="cal" class="grid grid-cols-7 gap-y-1 text-center"></div>
  <div id="stats" class="mt-3 text-xs" style="color:#9a9aa0"></div>
  <div id="detail" class="mt-2"></div>
</section>

<main class="flex-1 min-h-0 px-4" style="padding-bottom:max(env(safe-area-inset-bottom),16px)">
  <div id="card" class="flex h-full flex-col">
    <div class="flex items-baseline justify-between">
      <div id="planName" class="glow text-2xl font-black"></div>
      <div id="progTxt" class="text-sm opacity-80"></div>
    </div>
    <div class="mt-2 h-2 w-full overflow-hidden rounded-full bg-w10"><div id="bar" class="bar h-full" style="width:0"></div></div>
    <div id="items" class="mt-3 flex min-h-0 flex-1 flex-col gap-3 overflow-y-auto"></div>
    <div id="foot" class="mt-4"></div>
  </div>
</main>

<div id="settings" class="sheet">
  <div class="sys p-4" style="width:100%;border-bottom-left-radius:0;border-bottom-right-radius:0;padding-bottom:max(env(safe-area-inset-bottom),20px)">
    <div class="mb-3 flex items-center justify-between">
      <div id="setTitle" class="text-lg font-bold text-white"></div>
      <button id="setClose" class="nav">✕</button>
    </div>
    <div id="langLbl" class="mb-2 text-xs" style="color:#9a9aa0"></div>
    <div id="langList" class="flex flex-col gap-2"></div>
  </div>
</div>

<script>
(() => {
  const KEY = 'saitama_training_v1', LKEY = 'zta_lang';
  const ITEMS = {
    1: [ { id: 'pu', spec: '20 × 5', sets: 5 }, { id: 'cr', spec: '20 × 5', sets: 5 } ],
    2: [ { id: 'sq', spec: '20 × 5', sets: 5 }, { id: 'bg', spec: '15 × 4', sets: 4 }, { id: 'co', spec: null, sets: 1 } ],
    3: [ { id: 'bk', spec: null, sets: 1 }, { id: 'co', spec: null, sets: 1 } ]
  };
  const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const I18N = {
    'zh-Hant': { name: '埼玉訓練', hist: '歷史總覽', streak: '持續天數', prev: '上個月', next: '下個月',
      wk: ['日','一','二','三','四','五','六'], ym: (y, m) => `${y}年${m}月`, mo: m => `${m}月`,
      stats: (a, b) => `累計達成 ${a} / ${b} 天`, pre: '開始使用之前，沒有訓練紀錄',
      done: '已達成', now: '進行中', miss: '未達成', set: (n, s) => `${n} 第${s}組`,
      one: '完成', nextSet: '完成一組', full: '✓ 已完成', qc: '任務完成　今日已鎖定', hint: '全部完成後，今日任務將鎖定',
      free: '自由安排', setT: '設定', langL: '語言', close: '關閉',
      plans: { 1: '上肢・推', 2: '下肢・腿', 3: '背部・核心' },
      ex: { pu: '伏地挺身', cr: '捲腹', sq: '深蹲', bg: '保加利亞分腿蹲', co: '核心自由訓練', bk: '背肌' } },
    'zh-Hans': { name: '埼玉训练', hist: '历史总览', streak: '持续天数', prev: '上个月', next: '下个月',
      wk: ['日','一','二','三','四','五','六'], ym: (y, m) => `${y}年${m}月`, mo: m => `${m}月`,
      stats: (a, b) => `累计达成 ${a} / ${b} 天`, pre: '开始使用之前，没有训练记录',
      done: '已达成', now: '进行中', miss: '未达成', set: (n, s) => `${n} 第${s}组`,
      one: '完成', nextSet: '完成一组', full: '✓ 已完成', qc: '任务完成　今日已锁定', hint: '全部完成后，今日任务将锁定',
      free: '自由安排', setT: '设置', langL: '语言', close: '关闭',
      plans: { 1: '上肢·推', 2: '下肢·腿', 3: '背部·核心' },
      ex: { pu: '俯卧撑', cr: '卷腹', sq: '深蹲', bg: '保加利亚分腿蹲', co: '核心自由训练', bk: '背肌' } },
    'en': { name: 'Saitama Training', hist: 'History', streak: 'Streak', prev: 'Previous month', next: 'Next month',
      wk: ['Su','Mo','Tu','We','Th','Fr','Sa'], ym: (y, m) => `${MON[m - 1]} ${y}`, mo: m => MON[m - 1],
      stats: (a, b) => `Completed ${a} / ${b} days`, pre: 'Before you started — no records',
      done: 'Done', now: 'In progress', miss: 'Missed', set: (n, s) => `${n} set ${s}`,
      one: 'Done', nextSet: 'Next set', full: '✓ Completed', qc: 'Quest complete · locked for today', hint: 'Finish everything to lock today',
      free: 'Your choice', setT: 'Settings', langL: 'Language', close: 'Close',
      plans: { 1: 'Upper body · Push', 2: 'Lower body · Legs', 3: 'Back · Core' },
      ex: { pu: 'Push-ups', cr: 'Crunches', sq: 'Squats', bg: 'Bulgarian split squats', co: 'Free core workout', bk: 'Back muscles' } }
  };
  const LANGS = [['zh-Hant', '繁體中文'], ['zh-Hans', '简体中文'], ['en', 'English']];
  const WK = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');
  const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const num = k => { const [a,b,c] = k.split('-').map(Number); return Date.UTC(a, b-1, c) / 864e5; };
  const keyFromNum = n => { const d = new Date(n * 864e5); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`; };
  const wkOf = k => WK[new Date(num(k) * 864e5).getUTCDay()];

  const detect = () => {
    const l = ((navigator.languages && navigator.languages[0]) || navigator.language || 'en').toLowerCase();
    if (l.indexOf('zh') === 0) return /hant|tw|hk|mo/.test(l) ? 'zh-Hant' : 'zh-Hans';
    return 'en';
  };
  let lang = null;
  try { lang = localStorage.getItem(LKEY); } catch (e) {}
  if (!I18N[lang]) lang = detect();
  let T = I18N[lang];

  let S = null;
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!S || !S.start) { S = { start: keyOf(new Date()), log: {} }; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  save();

  const rec = k => S.log[k] || { c: {}, done: false };
  const dayNo = k => Math.max(1, num(k) - num(S.start) + 1);
  const planOf = n => { const i = ((n - 1) % 3) + 1; return { idx: i, items: ITEMS[i] }; };
  const cnt = (r, it) => (r.c[it.id] || []).filter(Boolean).length;
  const spec = it => it.spec || T.free;

  let today = keyOf(new Date());
  let viewIdx = null, sel = null;

  function renderHistory() {
    const tn = num(today), sn = num(S.start);
    const [ty, tm] = today.split('-').map(Number), [sy, sm] = S.start.split('-').map(Number);
    const cur = ty * 12 + tm - 1, lo = sy * 12 + sm - 1 - 12, hi = cur + 12;
    if (viewIdx === null) viewIdx = cur;
    viewIdx = Math.min(hi, Math.max(lo, viewIdx));
    if (!sel) sel = today;
    const y = Math.floor(viewIdx / 12), m = viewIdx % 12 + 1;
    $('monthTxt').textContent = T.ym(y, m);
    $('prevL').textContent = T.mo(m === 1 ? 12 : m - 1);
    $('nextL').textContent = T.mo(m === 12 ? 1 : m + 1);
    $('prevM').disabled = viewIdx <= lo;
    $('nextM').disabled = viewIdx >= hi;

    const firstDow = new Date(Date.UTC(y, m - 1, 1)).getUTCDay();
    const dim = new Date(Date.UTC(y, m, 0)).getUTCDate();
    let cells = '';
    for (let i = 0; i < firstDow; i++) cells += '<div></div>';
    for (let d = 1; d <= dim; d++) {
      const k = `${y}-${pad(m)}-${pad(d)}`, x = num(k), done = rec(k).done;
      const off = x > tn;
      let c = 'day';
      if (off) c += ' off'; else if (done) c += ' done'; else if (x < tn && x >= sn) c += ' miss';
      if (x < sn) c += ' pre';
      if (x === tn) c += ' today';
      if (k === sel && !off) c += ' sel';
      cells += `<button class="${c}" data-k="${k}" ${off ? 'disabled' : ''}>${d}</button>`;
    }
    $('cal').innerHTML = cells;
    const ok = Object.values(S.log).filter(v => v.done).length;
    $('stats').textContent = T.stats(ok, tn - sn + 1);

    const md = sel.slice(5).replace('-', '/');
    if (num(sel) < sn) {
      $('detail').innerHTML = `<div class="rounded-2xl p-4 text-sm" style="background:#18181b;color:rgba(255,255,255,.7)">${md} · ${T.pre}</div>`;
      return;
    }
    const n = dayNo(sel), plan = planOf(n), r = rec(sel), done = r.done;
    const st = done ? T.done : (sel === today ? T.now : T.miss);
    $('detail').innerHTML = `<div class="rounded-2xl p-4" style="background:${done ? 'linear-gradient(135deg,#f26b24,#c44a12)' : '#18181b'}">
      <div class="flex items-baseline justify-between"><div class="text-lg font-black text-white">${T.plans[plan.idx]}</div>
      <div class="text-xs" style="color:rgba(255,255,255,.7)">${md} · DAY ${pad(n)} · ${st}</div></div>
      <div class="mt-2 space-y-1 text-sm" style="color:rgba(255,255,255,.75)">${plan.items.map(it =>
        `<div class="flex justify-between"><span>${T.ex[it.id]}</span><span>${cnt(r, it)}/${it.sets}</span></div>`).join('')}</div></div>`;
  }

  function render() {
    today = keyOf(new Date());
    const n = dayNo(today), plan = planOf(n), r = rec(today);
    const [, m, d] = today.split('-');
    $('dateTxt').textContent = `${m}/${d}`;
    $('wkTxt').textContent = wkOf(today);
    $('dayTxt').textContent = 'DAY ' + String(n).padStart(3, '0');
    $('planName').textContent = T.plans[plan.idx];

    let total = 0, got = 0;
    plan.items.forEach(it => { total += it.sets; got += cnt(r, it); });
    $('progTxt').textContent = `${got} / ${total}`;
    $('bar').style.width = (total ? got / total * 100 : 0) + '%';

    $('card').classList.toggle('locked', r.done);
    const THEME = { pu: 't1', cr: 't2', sq: 't3', bg: 't4', bk: 't5', co: 't6' };
    $('items').innerHTML = plan.items.map(it => {
      const arr = r.c[it.id] || [];
      const c = cnt(r, it), full = c === it.sets, dis = r.done ? 'disabled' : '';
      const nm = T.ex[it.id];
      let dots = '';
      if (it.sets > 1) for (let s = 0; s < it.sets; s++) {
        const on = !!arr[s];
        dots += `<button data-i="${it.id}" data-s="${s}" ${dis} class="cell ${on ? 'on' : ''} h-12 flex-1 rounded-xl text-lg font-bold" aria-pressed="${on}" aria-label="${nm} ${T.set(nm, s + 1).slice(nm.length + 1)}">${on ? '✓' : s + 1}</button>`;
      }
      const act = it.sets === 1
        ? `<button data-i="${it.id}" data-s="0" ${dis} class="act">${full ? T.full : T.one}</button>`
        : `<button data-i="${it.id}" data-s="next" ${dis} class="act">${full ? T.full : T.nextSet}</button>`;
      return `<div class="task ${THEME[it.id]} ${full ? 'is-done' : ''}">
        <div class="flex items-start justify-between gap-3">
          <div><div class="text-2xl font-black text-white">${nm}</div><div class="mt-1 text-sm" style="color:rgba(255,255,255,.6)">${spec(it)}</div></div>
          <div class="flex flex-col items-end gap-2"><div class="glow text-sm font-bold">${c} / ${it.sets}</div>${act}</div></div>
        ${it.sets > 1 ? `<div class="flex gap-2">${dots}</div>` : ''}</div>`;
    }).join('');

    $('foot').innerHTML = r.done
      ? `<div class="quest rounded-xl py-4 text-center"><div class="glow text-2xl font-black tracking-widest">QUEST COMPLETE</div><div class="mt-1 text-sm">${T.qc}</div></div>`
      : `<div class="py-3 text-center text-sm opacity-60">${T.hint}</div>`;

    renderHistory();
  }

  function apply() {
    T = I18N[lang];
    document.documentElement.lang = lang;
    document.title = T.name;
    const mt = document.querySelector('meta[name="apple-mobile-web-app-title"]');
    if (mt) mt.content = T.name;
    $('histLbl').textContent = T.hist;
    $('streakLbl').textContent = T.streak;
    $('prevM').setAttribute('aria-label', T.prev);
    $('nextM').setAttribute('aria-label', T.next);
    $('gearBtn').setAttribute('aria-label', T.setT);
    $('setClose').setAttribute('aria-label', T.close);
    $('wkHead').innerHTML = T.wk.map(w => `<div>${w}</div>`).join('');
    $('setTitle').textContent = T.setT;
    $('langLbl').textContent = T.langL;
    $('langList').innerHTML = LANGS.map(([c, n]) =>
      `<button class="lang ${c === lang ? 'on' : ''}" data-l="${c}"><span>${n}</span><span>${c === lang ? '✓' : ''}</span></button>`).join('');
    render();
  }

  $('items').addEventListener('click', e => {
    const b = e.target.closest('[data-i]');
    if (!b) return;
    if (keyOf(new Date()) !== today) { render(); return; }
    const n = dayNo(today), plan = planOf(n);
    const r = S.log[today] || (S.log[today] = { c: {}, done: false });
    if (r.done) return;
    const it = plan.items.find(x => x.id === b.dataset.i);
    const arr = r.c[it.id] || (r.c[it.id] = Array(it.sets).fill(false));
    const s = b.dataset.s === 'next' ? arr.findIndex(v => !v) : +b.dataset.s;
    if (s < 0) return;
    arr[s] = !arr[s];
    r.done = plan.items.every(x => cnt(r, x) === x.sets);
    save();
    render();
    if (r.done && navigator.vibrate) navigator.vibrate([80, 40, 160]);
  });

  $('dateBtn').addEventListener('click', () => {
    const p = $('panel'), open = p.classList.toggle('hidden') === false;
    if (open) { viewIdx = null; sel = today; renderHistory(); }
    $('arrow').textContent = open ? '▴' : '▾';
    $('dateBtn').setAttribute('aria-expanded', open);
  });
  $('cal').addEventListener('click', e => {
    const b = e.target.closest('[data-k]');
    if (!b || b.disabled) return;
    sel = b.dataset.k; renderHistory();
  });
  $('prevM').addEventListener('click', () => { viewIdx--; renderHistory(); });
  $('nextM').addEventListener('click', () => { viewIdx++; renderHistory(); });

  const openSet = () => $('settings').classList.add('show');
  const closeSet = () => $('settings').classList.remove('show');
  $('gearBtn').addEventListener('click', openSet);
  $('setClose').addEventListener('click', closeSet);
  $('settings').addEventListener('click', e => { if (e.target === $('settings')) closeSet(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSet(); });
  $('langList').addEventListener('click', e => {
    const b = e.target.closest('[data-l]');
    if (!b) return;
    lang = b.dataset.l;
    try { localStorage.setItem(LKEY, lang); } catch (err) {}
    apply();
  });

  const tick = () => { if (keyOf(new Date()) !== today) render(); };
  setInterval(tick, 15000);
  document.addEventListener('visibilitychange', tick);

  apply();
})();
</script>
</body>
</html>
