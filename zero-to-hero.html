<style>
  /* minimal utilities (no external CSS/JS needed) */
  *, ::before, ::after { box-sizing: border-box; border: 0 solid; }
  html { line-height: 1.5; -webkit-text-size-adjust: 100%; }
  body { margin: 0; }
  button { background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; text-align: center; }
  .flex{display:flex}.flex-col{flex-direction:column}.flex-1{flex:1 1 0%}.grid{display:grid}.hidden{display:none}
  .grid-cols-7{grid-template-columns:repeat(7,minmax(0,1fr))}
  .items-center{align-items:center}.items-start{align-items:flex-start}.items-end{align-items:flex-end}.items-baseline{align-items:baseline}
  .justify-between{justify-content:space-between}
  .gap-2{gap:.5rem}.gap-3{gap:.75rem}.gap-y-1{row-gap:.25rem}
  .px-4{padding-left:1rem;padding-right:1rem}.pb-3{padding-bottom:.75rem}.py-2{padding-top:.5rem;padding-bottom:.5rem}
  .py-3{padding-top:.75rem;padding-bottom:.75rem}.py-4{padding-top:1rem;padding-bottom:1rem}.p-4{padding:1rem}
  .mx-4{margin-left:1rem;margin-right:1rem}.mb-1{margin-bottom:.25rem}.mb-3{margin-bottom:.75rem}
  .mt-1{margin-top:.25rem}.mt-2{margin-top:.5rem}.mt-3{margin-top:.75rem}.mt-4{margin-top:1rem}
  .space-y-1>*+*{margin-top:.25rem}
  .h-full{height:100%}.w-full{width:100%}.h-2{height:.5rem}.h-12{height:3rem}.min-h-0{min-height:0}
  .text-11{font-size:11px}.text-xs{font-size:.75rem;line-height:1rem}.text-sm{font-size:.875rem;line-height:1.25rem}
  .text-lg{font-size:1.125rem;line-height:1.75rem}.text-xl{font-size:1.25rem;line-height:1.75rem}
  .text-2xl{font-size:1.5rem;line-height:2rem}.text-4xl{font-size:2.25rem;line-height:2.5rem}
  .font-bold{font-weight:700}.font-black{font-weight:900}
  .tracking-wide{letter-spacing:.025em}.tracking-wider{letter-spacing:.05em}.tracking-widest{letter-spacing:.1em}
  .text-left{text-align:left}.text-right{text-align:right}.text-center{text-align:center}.text-white{color:#fff}
  .opacity-60{opacity:.6}.opacity-70{opacity:.7}.opacity-80{opacity:.8}
  .bg-w10{background:rgba(255,255,255,.1)}

  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse 90% 38% at 50% -6%, rgba(232,96,28,.26), transparent 70%), #0b0b0d fixed;
    color: #f2f2f3;
    font-family: system-ui, -apple-system, "SF Pro Display", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  .sys {
    border: 1px solid rgba(255,255,255,.07);
    border-top-color: rgba(255,122,48,.55);
    background: linear-gradient(160deg, rgba(255,122,48,.15), rgba(21,21,23,.96) 48%);
    box-shadow: 0 0 22px rgba(232,96,28,.12);
    border-radius: 20px;
  }
  .glow { color: #ff8a45; text-shadow: 0 0 12px rgba(255,122,48,.5); }
  .cell {
    min-width: 0;
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.05);
    color: #b9b9bf;
    transition: transform .12s, box-shadow .2s, background .2s;
  }
  .cell:active:not(:disabled) { transform: scale(.94); }
  .cell.on { background: linear-gradient(135deg, #ff7a30, #d9531a); color: #fff; border-color: #ffb27f; box-shadow: 0 0 16px rgba(255,122,48,.6); }
  .cell:disabled { cursor: not-allowed; }
  .locked .cell:not(.on) { opacity: .35; }
  .bar { background: linear-gradient(90deg, #d9531a, #ff8a45); box-shadow: 0 0 10px rgba(255,122,48,.7); transition: width .3s; }
  .quest { border: 1px solid #ffb27f; background: linear-gradient(135deg, rgba(255,122,48,.42), rgba(217,83,26,.25)); box-shadow: 0 0 26px rgba(255,122,48,.45); animation: pop .5s ease-out; }
  @keyframes pop { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .task {
    --g: 100% 0%;
    position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: 14px;
    flex: 1 0 136px; overflow: hidden; border-radius: 22px; padding: 18px;
    border: 1px solid rgba(255,255,255,.07); border-top-color: rgba(255,122,48,.5);

      <div class="chips">${DAYS.map(d => `<button class="chip ${ui.days === d ? 'on' : ''}" data-act="days" data-v="${d}">${d}<small>${c.d.trim()}</small></button>`).join('')}</div>
      ${ui.days ? `<div class="card pv"><div>${c.restN(Math.floor(ui.days / 4))}</div><div>${c.tokN(Math.ceil(ui.days / CYC) * TPC, TPC)}</div></div>` : ''}
      <button class="btn" data-act="to3" ${ui.days ? '' : 'disabled'}>${c.next}</button><button class="ghost" data-act="to1">${c.back}</button>`; },
    o3: () => { const c = T.c; return `<div class="step">STEP 3 / 3</div><h1>${c.o3t}</h1><p class="sub">${c.o3s(c.mn[ui.mode], ui.days)}</p>
      <div class="card"><ul class="rules">${c.rules(TPC).map(r => `<li>${r}</li>`).join('')}</ul></div>
      <button class="agree" data-act="agree"><i>${ui.agree ? '✓' : ''}</i>${c.agree}</button>
      <button class="hold" id="hold" ${ui.agree ? '' : 'disabled'}><i id="holdFill"></i><span>${c.hold}</span></button>
      <button class="ghost" data-act="to2">${c.back}</button>`; }
  };
  function showOb() { document.body.classList.add('ob'); $ob.innerHTML = OB[ui.v](); if (ui.v === 'o3') bindHold(); $ob.scrollTop = 0; }
  function bindHold() {
    const h = $('hold'), f = $('holdFill'); if (!h || h.disabled) return;
    let t0 = 0, raf = 0;
    const step = () => { const r = Math.min((performance.now() - t0) / 1500, 1); f.style.width = r * 100 + '%';
      if (r >= 1) { cancelAnimationFrame(raf); sign(ui.mode, ui.days); if (navigator.vibrate) navigator.vibrate([60, 40, 160]); boot(); return; } raf = requestAnimationFrame(step); };
    const stop = () => { cancelAnimationFrame(raf); f.style.width = '0'; };
    h.addEventListener('pointerdown', e => { e.preventDefault(); t0 = performance.now(); raf = requestAnimationFrame(step); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => h.addEventListener(ev, stop));
  }

  let wTimer = 0;
  function showWasted() {
    document.body.classList.remove('ob'); apply();
    const f = S.failure;
    $('wcause').innerHTML = T.c.wcause(f);
    $('wasted').classList.add('show'); clearTimeout(wTimer); wTimer = setTimeout(afterWasted, 6000);
  }
  function afterWasted() {
    clearTimeout(wTimer); $('wasted').classList.remove('show');
    if (S.status !== 'failed') return;
    archive('failed', '');
    const note = { total: S.lifetime.totalDays, best: S.lifetime.bestStreak };
    resetRun(); ui.note = note; showOb();
  }
  function showTokAsk(t) {
    $('wasted').classList.remove('show'); document.body.classList.add('ob');
    const m = t.m, n = dayNo(m[0]), c = T.c, lead = m.length === 1 ? c.lead1 : c.leadN(m.length);
    $ob.innerHTML = `<div style="padding-top:8dvh"><h1>${lead}</h1><p class="sub">${c.tokQ}</p>
      <div class="card pv"><div>${c.need(m.length, t.left)}</div><div>${c.delay(n)}</div><div>${c.noUse}</div></div>
      <button class="btn" data-act="tok">${c.useTok(m.length)}</button>
      <button class="btn alt" data-act="nofight">${c.accept}</button></div>`;
  }
  function showDone() {
    const a = S.archive[S.archive.length - 1]; document.body.classList.add('ob');
    const c = T.c;
    $ob.innerHTML = `<div style="text-align:center;padding-top:10dvh"><div class="big">🏆</div><h1>${c.legend}</h1><p class="sub">${c.legendS(c.mn[a.mode], a.days)}</p>
      <div class="card pv"><div>${badgeText(a)}</div><div>${c.life(S.lifetime.totalDays, S.lifetime.bestStreak)}</div></div><button class="btn" data-share style="display:flex;align-items:center;justify-content:center;gap:8px">${SHARE_ICON}<span>${c.shBtn}</span></button><button class="btn alt" data-act="newrun">${c.newRun}</button></div>`;
  }
  const openModal = h => { $('modalBody').innerHTML = h; $('modal').classList.add('show'); };
  function maybeMilestone() {
    const c = S.contract, ms = Math.floor(doneCount() / CYC) * CYC;
    if (ms >= CYC && ms < c.days && ms > (S.asked || 0))
      openModal(`<h1 style="font-size:1.4rem;color:#ff8a45">${T.c.msT(ms)}</h1><p class="sub" style="margin:8px 0 6px">${T.c.msQ(c.days - ms)}</p>
        <button class="btn" data-m="go">${T.c.msGo}</button><button class="btn alt" data-m="stop">${T.c.msStop(ms)}</button>`);
  }

  const SHARE_ICON = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
  function renderShare() {
    const b = $('shareBar'), d = shareData(); if (!d) { b.innerHTML = ''; return; }
    let th = ''; try { const cv = drawCard(d), t = document.createElement('canvas'); t.width = 216; t.height = 270; t.getContext('2d').drawImage(cv, 0, 0, 216, 270); th = t.toDataURL('image/jpeg', .85); } catch (e) {}
    const done = S.contract && rec(sel || today).done;
    b.innerHTML = `<div class="hfrow">${th ? `<button class="thumb" data-prev aria-label="${T.c.shBtn}"><img src="${th}" alt=""></button>` : ''}${done ? `<div class="quest hq"><div class="glow text-xl font-black tracking-widest">QUEST COMPLETE</div><div class="mt-1 text-sm">${T.qc}</div></div>` : ''}</div>
      <button class="shbtn" data-share>${SHARE_ICON}<span>${T.c.shBtn}</span></button>`;
  }
  function shareData() {
    const c = S.contract, L = S.lifetime || { totalDays: 0, bestStreak: 0 };
    if (c && S.status === 'active') return { st: 'active', n: doneCount(), total: c.days, mode: c.mode, all: L.totalDays + doneCount(), best: Math.max(L.bestStreak, best()) };
    const a = S.archive[S.archive.length - 1]; if (!a) return null;
    return { st: /^(legend|endurance)/.test(a.badge || '') ? 'done' : 'fail', n: a.daysDone || 0, total: a.days, mode: a.mode, all: L.totalDays, best: L.bestStreak };
  }
  function drawCard(d) {
    const W = 1080, H = 1350, cv = document.createElement('canvas'); cv.width = W; cv.height = H; const g = cv.getContext('2d');
    const FF = '-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif', c = T.c;
    g.fillStyle = '#0b0b0d'; g.fillRect(0, 0, W, H);
    const rg = g.createRadialGradient(W / 2, 430, 40, W / 2, 430, 760); rg.addColorStop(0, 'rgba(255,106,0,.42)'); rg.addColorStop(1, 'rgba(255,106,0,0)'); g.fillStyle = rg; g.fillRect(0, 0, W, H);
    g.strokeStyle = 'rgba(255,138,69,.55)'; g.lineWidth = 3; g.beginPath(); g.roundRect(40, 40, W - 80, H - 80, 48); g.stroke();
    g.textAlign = 'center'; g.fillStyle = '#ff8a45'; g.font = `900 64px ${FF}`; g.shadowColor = '#ff6a00'; g.shadowBlur = 24; g.fillText(T.name, W / 2, 190);
    g.shadowBlur = 0; g.fillStyle = 'rgba(255,255,255,.55)'; g.font = `700 30px ${FF}`; g.fillText('ZERO TO HERO', W / 2, 240);
    const tag = d.st === 'done' ? c.shDone : d.st === 'fail' ? c.shFail(d.n) : c.shHold;
    g.fillStyle = '#fff'; g.font = `800 52px ${FF}`; g.fillText(tag, W / 2, 400);
    g.fillStyle = '#ff8a45'; g.font = `900 320px ${FF}`; g.shadowColor = '#ff6a00'; g.shadowBlur = 50; g.fillText(String(d.n), W / 2, 700); g.shadowBlur = 0;
    g.fillStyle = '#fff'; g.font = `800 56px ${FF}`; g.fillText(c.shU, W / 2, 790);
    const bx = 140, bw = W - 280, by = 870; g.fillStyle = 'rgba(255,255,255,.12)'; g.beginPath(); g.roundRect(bx, by, bw, 26, 13); g.fill();
    const pr = Math.max(0, Math.min(1, d.n / (d.total || 1))); if (pr > 0) { g.fillStyle = '#ff7a1a'; g.beginPath(); g.roundRect(bx, by, Math.max(26, bw * pr), 26, 13); g.fill(); }
    g.fillStyle = 'rgba(255,255,255,.85)'; g.font = `700 40px ${FF}`; g.fillText(c.shSub(c.mn[d.mode], d.total), W / 2, 980);
    g.fillStyle = 'rgba(255,255,255,.6)'; g.font = `600 34px ${FF}`; g.fillText(c.shLife(d.all, d.best), W / 2, 1050);
    g.fillStyle = 'rgba(255,255,255,.4)'; g.font = `600 30px ${FF}`; g.fillText(keyOf(new Date()), W / 2, 1110);
    g.fillStyle = 'rgba(255,255,255,.5)'; g.font = `700 32px ${FF}`; g.fillText('zero-to-apps.github.io', W / 2, 1240);
    return cv;
  }
  async function doShare() {
    const d = shareData(); if (!d) return;
    const cv = drawCard(d), blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    try { const f = new File([blob], 'zero-to-hero.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f] }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    openPreview(false, cv);
  }
  function openPreview(withShare, cv) {
    cv = cv || drawCard(shareData());
    openModal(`<img src="${cv.toDataURL('image/png')}" alt="" style="display:block;max-width:100%;max-height:58dvh;margin:0 auto;border-radius:14px">${withShare ? `<button class="shbtn" data-share style="margin-top:12px">${SHARE_ICON}<span>${T.c.shBtn}</span></button>` : `<p class="sub" style="margin:10px 0 0;text-align:center">${T.c.shSave}</p>`}<button class="btn alt" data-m="ok">${T.c.ok}</button>`);
  }
  document.addEventListener('click', e => { if (e.target.closest('[data-share]')) doShare(); else if (e.target.closest('[data-prev]')) openPreview(true); });
  function renderChal() {
    let h = '', c = T.c;
    renderShare();
    if (S.contract && S.status === 'active') h += `<div class="lbl" style="margin-top:16px">${c.chL}</div><div class="row2">${c.chRow(c.mn[S.contract.mode], S.contract.days, S.start)}</div><button class="lang" data-ab="1" style="color:#ff6b6b"><span>${c.abBtn}</span><span></span></button>`;
    if (S.archive.length) h += `<div class="lbl" style="margin-top:16px">${c.hof}</div><div class="row2" style="color:#ff8a45;font-weight:700">${c.hofMax(Math.max(0, ...S.archive.map(a => a.daysDone || 0), S.status === 'active' ? doneCount() : 0))}</div>` + S.archive.slice().reverse().map(a => `<div class="row2">${badgeText(a)}</div>`).join('');
    $('chal').innerHTML = h;
  }
  function renderMeta() {
    if (!S.contract) return;
    const c = S.contract, n = dayNo(today);
    $('dayTxt').innerHTML = `DAY ${String(n).padStart(3, '0')} <span style="font-size:.9rem;color:#9a9aa0">/ ${c.days}</span>`;
    $('meta').textContent = T.c.meta(T.c.mn[c.mode], c.days, TPC - usedIn(cycleOf(n)), TPC, Math.max(0, c.days - doneCount()));
  }
  const _render = render; render = function () { _render(); renderMeta(); };
  const _apply = apply; apply = function () {
    _apply(); renderChal();
    const ws = document.querySelector('#wasted .wsub'), wh = document.querySelector('#wasted .whint');
    if (ws) ws.textContent = T.c.wsub; if (wh) wh.textContent = T.c.whint;
    if (S.status === 'failed' && S.failure && $('wasted').classList.contains('show')) $('wcause').innerHTML = T.c.wcause(S.failure);
    if (document.body.classList.contains('ob') && S.status === 'idle') showOb();
  };

  function boot() {
    today = keyOf(new Date());
    if (S.status === 'active') {
      const m = findMiss();
      if (m.length) { const t = tokInfo(); if (t.ok) { save(); return showTokAsk(t); } fail(m); }
      else if (doneCount() >= S.contract.days) { archive('completed', 'legend-' + S.contract.days); S.status = 'completed'; }
      save();
    }
    if (S.status === 'failed') return showWasted();
    if (S.status === 'completed') return showDone();
    if (S.status !== 'active') return showOb();
    $('wasted').classList.remove('show'); document.body.classList.remove('ob'); apply(); maybeMilestone();
  }
  $ob.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    const a = b.dataset.act, v = b.dataset.v;
    if (a === 'mode') ui.mode = v; else if (a === 'days') ui.days = +v; else if (a === 'agree') ui.agree = !ui.agree;
    else if (a === 'to1') ui.v = 'o1'; else if (a === 'to2') ui.v = 'o2'; else if (a === 'to3') ui.v = 'o3';
    else if (a === 'tok') { const t = tokInfo(); if (t.ok) { t.m.forEach(d => S.tokensUsed.push({ cycle: cycleOf(dayNo(d)), date: d })); save(); } boot(); return; }
    else if (a === 'nofight') { const m = findMiss(); if (m.length) { fail(m); save(); } boot(); return; }
    else if (a === 'restart') { archive('failed', ''); resetRun(); showOb(); return; }
    else if (a === 'newrun') { resetRun(); showOb(); return; }
    showOb();
  });
  $('wasted').addEventListener('click', afterWasted);
  $('modalBody').addEventListener('click', e => {
    const b = e.target.closest('[data-m]'); if (!b) return;
    const k = b.dataset.m, ms = Math.floor(doneCount() / CYC) * CYC;
    $('modal').classList.remove('show');
    if (k === 'go') { S.asked = ms; save(); }
    else if (k === 'stop') { archive('abandoned', 'endurance-' + ms); resetRun(); boot(); }
    else if (k === 'ab-yes') { archive('abandoned', ms >= CYC ? 'endurance-' + ms : ''); resetRun(); closeSet(); boot(); }
  });
  $('chal').addEventListener('click', e => {
    if (!e.target.closest('[data-ab]')) return;
    openModal(`<h1 style="font-size:1.4rem;color:#ff6b6b">${T.c.abT}</h1><p class="sub" style="margin:8px 0 6px">${T.c.abS}</p>
      <button class="btn" data-m="ab-yes" style="background:#c93636">${T.c.abYes}</button><button class="btn alt" data-m="ab-no">${T.c.abNo}</button>`);
  });

  $('items').addEventListener('click', e => {
    const b = e.target.closest('[data-i]');
    if (!b) return;
    if (keyOf(new Date()) !== today) { boot(); return; }
    if (S.status !== 'active') return;
    if (rolledBack()) { openModal(`<h1 style="font-size:1.4rem;color:#ff8a45">${T.c.rbT}</h1><p class="sub" style="margin:8px 0 6px">${T.c.rbS}</p><button class="btn" data-m="ok">${T.c.ok}</button>`); return; }
    const n = dayNo(today), plan = planOf(n);
    const r = S.log[today] || (S.log[today] = { c: {}, done: false });
    if (r.done) return;
    const it = plan.items.find(x => x.id === b.dataset.i);
    const arr = r.c[it.id] || (r.c[it.id] = Array(it.sets).fill(false));
    const s = b.dataset.s === 'next' ? arr.findIndex(v => !v) : +b.dataset.s;
    if (s < 0) return;
    arr[s] = !arr[s];
    r.done = plan.items.every(x => cnt(r, x) === x.sets);
    save();
    render();
    if (r.done) { if (navigator.vibrate) navigator.vibrate([80, 40, 160]); if (doneCount() >= S.contract.days) boot(); else maybeMilestone(); }
  });

  $('dateBtn').addEventListener('click', () => {
    const p = $('panel'), open = p.classList.toggle('hidden') === false;
    if (open) { viewIdx = null; sel = today; renderHistory(); }
    document.body.classList.toggle('hist', open); if (open) renderShare();
    $('arrow').textContent = open ? '▴' : '▾';
    $('dateBtn').setAttribute('aria-expanded', open);
  });
  $('cal').addEventListener('click', e => {
    const b = e.target.closest('[data-k]');
    if (!b || b.disabled) return;
    sel = b.dataset.k; renderHistory(); renderShare();
  });
  $('prevM').addEventListener('click', () => { viewIdx--; renderHistory(); });
  $('nextM').addEventListener('click', () => { viewIdx++; renderHistory(); });

  const openSet = () => $('settings').classList.add('show');
  const closeSet = () => $('settings').classList.remove('show');
  $('gearBtn').addEventListener('click', openSet);
  $('setClose').addEventListener('click', closeSet);
  $('settings').addEventListener('click', e => { if (e.target === $('settings')) closeSet(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSet(); });
  $('langList').addEventListener('click', e => {
    const b = e.target.closest('[data-l]');
    if (!b) return;
    lang = b.dataset.l;
    try { localStorage.setItem(LKEY, lang); } catch (err) {}
    apply();
  });

  const tick = () => { if (keyOf(new Date()) !== today) boot(); };
  setInterval(tick, 15000);
  document.addEventListener('visibilitychange', tick);

  boot();
})();
</script>
</body>
</html>
